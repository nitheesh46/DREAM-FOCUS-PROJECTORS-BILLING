<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DREAM FOCUS PROJECTORS - Billing & Reports</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for Graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- HTML2PDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @page { size: A4; margin: 6mm; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      #printable-invoice, #audit-modal-printable { 
        box-shadow: none !important; 
        border: none !important; 
        width: 100% !important; 
        margin: 0 !important; 
        display: block !important; 
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-28 md:pb-12">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- Vector Logos & Stamps ---
const ProjectorLogo = () => (
  <svg className="w-10 h-10 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="20" fill="#0284C7"/>
    <rect x="15" y="38" width="55" height="30" rx="6" fill="#FFFFFF"/>
    <circle cx="35" cy="53" r="9" fill="#0F172A" stroke="#38BDF8" strokeWidth="3"/>
    <circle cx="35" cy="53" r="4" fill="#F59E0B"/>
    <path d="M68 46L90 32V74L68 60V46Z" fill="#F59E0B" opacity="0.9"/>
    <line x1="52" y1="45" x2="52" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <line x1="58" y1="45" x2="58" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <rect x="22" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="54" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
  </svg>
);

const RubberStamp = ({ isPaid }) => (
  <div className="w-24 h-24 rounded-full border-4 border-double border-blue-800 text-blue-900 p-2 flex flex-col items-center justify-center -rotate-12 select-none opacity-85 shadow-[0_0_0_1px_#1e40af] bg-blue-50/20">
    <span className="text-[6.5px] font-black tracking-widest text-center leading-tight uppercase">★ DREAM FOCUS ★<br/>PROJECTORS</span>
    <span className={`text-[9.5px] font-extrabold border-y-2 border-blue-800 my-0.5 px-2 tracking-wider uppercase ${isPaid ? 'text-emerald-700' : 'text-amber-700'}`}>
      {isPaid ? 'PAID FULL' : 'ADVANCE RECVD'}
    </span>
    <span className="text-[6.5px] font-bold tracking-wider">MADURAI - 625002</span>
  </div>
);

// --- Handwritten Vector Signature (Exact Match to Uploaded Image) ---
const DigitalSignature = () => (
  <div className="text-right flex flex-col items-end" style={{ minWidth: '170px' }}>
    <span className="text-[10px] text-slate-500 font-semibold mb-0.5">Authorized Signatory</span>
    <div style={{ width: '160px', height: '52px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 180 60" 
        width="160" 
        height="52" 
        style={{ display: 'block', overflow: 'visible' }}
      >
        {/* Initial 'M' stroke */}
        <path 
          d="M 22,42 L 30,22 L 34,35 L 40,23 L 42,40 C 44,46 54,47 62,39" 
          stroke="#0f172a" 
          strokeWidth="2.2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          fill="none" 
        />
        {/* Tall vertical ascender loop with sharp downstroke */}
        <path 
          d="M 62,39 L 75,10 L 67,46 C 68,36 72,22 76,17 L 71,44" 
          stroke="#0f172a" 
          strokeWidth="2.2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          fill="none" 
        />
        {/* Wavy cursive baseline flowing into long rightward arrow sweep */}
        <path 
          d="M 71,36 Q 76,31 80,33 Q 85,30 89,33 L 95,31 Q 104,30 148,27 L 165,25 L 152,33" 
          stroke="#0f172a" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          fill="none" 
        />
        {/* Underline accent */}
        <path 
          d="M 72,38 L 105,36" 
          stroke="#0f172a" 
          strokeWidth="1.8" 
          strokeLinecap="round" 
          fill="none" 
        />
        {/* Three distinct signature dots */}
        <circle cx="118" cy="35" r="1.6" fill="#0f172a" />
        <circle cx="129" cy="34.5" r="1.6" fill="#0f172a" />
        <circle cx="140" cy="34" r="1.6" fill="#0f172a" />
      </svg>
    </div>
    <div className="text-[11px] font-bold text-slate-900 border-t border-slate-900 pt-0.5 w-40 text-center">
      M. KANAGAVEL (Proprietor)
    </div>
  </div>
);

// Starter Seed Records
const DEFAULT_RECORDS = [
  {
    invNo: "DFP/2026/1012", date: "2026-06-12", custName: "Senthil Nathan", custPhone: "9842100001", custAddr: "KK Nagar, Madurai",
    paymentStatus: "Full Paid", paymentMode: "GPay / PhonePe UPI",
    items: [{ id: 1, desc: "Epson EB-X41 Pre-Owned Projector", category: "Sales Unit", qty: 1, rate: 14000 }],
    grossTotal: 14000, discount: 500, exchange: 0, taxableAmount: 13500, gstRate: 18, cgst: 1215, sgst: 1215, totalTax: 2430, netPayable: 15930, paid: 15930, pending: 0
  },
  {
    invNo: "DFP/2026/1045", date: "2026-07-20", custName: "Velmurugan Arts Academy", custPhone: "9842100002", custAddr: "Sellur, Madurai",
    paymentStatus: "Advance Paid", paymentMode: "Bank Transfer / NEFT",
    items: [
      { id: 1, desc: "Sony 5000 Lumens Auditorium Projector", category: "Sales Unit", qty: 1, rate: 24000 },
      { id: 2, desc: "Optical Prism Alignment & Deep Clean", category: "Service", qty: 1, rate: 1800 }
    ],
    grossTotal: 25800, discount: 800, exchange: 2000, taxableAmount: 23000, gstRate: 18, cgst: 2070, sgst: 2070, totalTax: 4140, netPayable: 27140, paid: 15000, pending: 12140
  }
];

function App() {
  const [tab, setTab] = useState('create');
  const [deviceMode, setDeviceMode] = useState(() => window.innerWidth < 768 ? 'mobile' : 'laptop');
  const [showPreviewModal, setShowPreviewModal] = useState(false);
  const [auditPreviewInvoice, setAuditPreviewInvoice] = useState(null);
  const invoiceRef = useRef(null);

  // Chart Canvas & Instance Refs
  const barChartRef = useRef(null);
  const pieChartRef = useRef(null);
  const modeChartRef = useRef(null);
  const barChartInst = useRef(null);
  const pieChartInst = useRef(null);
  const modeChartInst = useRef(null);

  // Form State
  const [billMeta, setBillMeta] = useState({
    invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
    date: new Date().toISOString().slice(0, 10),
    custName: '',
    custPhone: '',
    custAddr: '',
    custGstin: '',
    paymentStatus: 'Advance Paid',
    paymentMode: 'GPay / PhonePe UPI'
  });

  const [items, setItems] = useState([
    { id: 1, desc: 'Epson EB-X41 Pre-Owned 3LCD Projector (3600 Lumens)', category: 'Sales Unit', qty: 1, rate: 14500 },
    { id: 2, desc: 'Original Remote Control + High Quality HDMI Cable Kit', category: 'Accessory', qty: 1, rate: 0 }
  ]);

  const [pricing, setPricing] = useState({
    discount: 500,
    exchange: 1000,
    gstRate: 18,
    advance: 5000
  });

  // LocalStorage Database
  const [history, setHistory] = useState(() => {
    const saved = localStorage.getItem('DFP_CHARTS_BILLS_V10');
    return saved ? JSON.parse(saved) : DEFAULT_RECORDS;
  });

  const [analyticsYear, setAnalyticsYear] = useState('2026');

  useEffect(() => {
    localStorage.setItem('DFP_CHARTS_BILLS_V10', JSON.stringify(history));
  }, [history]);

  useEffect(() => {
    const handleResize = () => {
      if (!localStorage.getItem('DFP_USER_MODE_PREF')) {
        setDeviceMode(window.innerWidth < 768 ? 'mobile' : 'laptop');
      }
    };
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  const toggleDeviceMode = (mode) => {
    setDeviceMode(mode);
    localStorage.setItem('DFP_USER_MODE_PREF', mode);
  };

  // Calculations
  const grossTotal = useMemo(() => items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.rate) || 0), 0), [items]);
  const taxableAmount = useMemo(() => Math.max(0, grossTotal - (Number(pricing.discount) || 0) - (Number(pricing.exchange) || 0)), [grossTotal, pricing.discount, pricing.exchange]);
  
  const gstBreakdown = useMemo(() => {
    const rate = Number(pricing.gstRate) || 0;
    const totalTax = (taxableAmount * rate) / 100;
    return {
      rate,
      cgst: totalTax / 2,
      sgst: totalTax / 2,
      totalTax,
      netPayable: Math.round(taxableAmount + totalTax)
    };
  }, [taxableAmount, pricing.gstRate]);

  const pendingDue = useMemo(() => {
    const paidVal = pricing.advance === '' ? 0 : Number(pricing.advance);
    return Math.max(0, gstBreakdown.netPayable - paidVal);
  }, [gstBreakdown.netPayable, pricing.advance]);

  // Payment Status Handlers
  const handleStatusChange = (status) => {
    setBillMeta(prev => ({ ...prev, paymentStatus: status }));
    if (status === 'Full Paid') {
      setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
    } else if (status === 'Pending (Zero Advance)') {
      setPricing(prev => ({ ...prev, advance: 0 }));
    } else if (status === 'Advance Paid') {
      if (Number(pricing.advance) >= gstBreakdown.netPayable || Number(pricing.advance) === 0) {
        const half = Math.round(gstBreakdown.netPayable / 2);
        setPricing(prev => ({ ...prev, advance: half > 0 ? half : 5000 }));
      }
    }
  };

  const handlePayFull = () => {
    setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
    setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
  };

  const handleSetAdvance = () => {
    setBillMeta(prev => ({ ...prev, paymentStatus: 'Advance Paid' }));
    if (Number(pricing.advance) >= gstBreakdown.netPayable || Number(pricing.advance) === 0) {
      const half = Math.round(gstBreakdown.netPayable / 2);
      setPricing(prev => ({ ...prev, advance: half > 0 ? half : 5000 }));
    }
  };

  const handleAmountPaidInput = (e) => {
    const val = e.target.value === '' ? '' : Number(e.target.value);
    setPricing(prev => ({ ...prev, advance: val }));
    const num = val === '' ? 0 : val;
    if (num >= gstBreakdown.netPayable && gstBreakdown.netPayable > 0) {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
    } else if (num === 0) {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Pending (Zero Advance)' }));
    } else {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Advance Paid' }));
    }
  };

  const addItem = () => setItems([...items, { id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, val) => setItems(items.map(i => i.id === id ? { ...i, [field]: val } : i));

  // Save Order Record
  const saveCurrentOrder = () => {
    const record = {
      ...billMeta,
      items,
      grossTotal,
      discount: Number(pricing.discount) || 0,
      exchange: Number(pricing.exchange) || 0,
      taxableAmount,
      gstRate: gstBreakdown.rate,
      cgst: gstBreakdown.cgst,
      sgst: gstBreakdown.sgst,
      totalTax: gstBreakdown.totalTax,
      netPayable: gstBreakdown.netPayable,
      paid: pricing.advance === '' ? 0 : Number(pricing.advance),
      pending: pendingDue,
      timestamp: Date.now()
    };
    setHistory(prev => {
      const idx = prev.findIndex(p => p.invNo === billMeta.invNo);
      return idx >= 0 ? prev.map((p, i) => i === idx ? record : p) : [record, ...prev];
    });
    return record;
  };

  const buildWhatsAppText = (record) => {
    return `*DREAM FOCUS PROJECTORS - TAX INVOICE*\n` +
      `*Invoice No:* ${record.invNo}\n` +
      `*Customer:* ${record.custName || 'Valued Customer'}\n` +
      `*Date:* ${record.date}\n` +
      `--------------------------\n` +
      `*Gross Total:* ₹${record.grossTotal.toLocaleString('en-IN')}\n` +
      (record.discount > 0 ? `*Discount:* -₹${record.discount.toLocaleString('en-IN')}\n` : '') +
      (record.exchange > 0 ? `*Exchange Old Unit:* -₹${record.exchange.toLocaleString('en-IN')}\n` : '') +
      `*Taxable Value:* ₹${record.taxableAmount.toLocaleString('en-IN')}\n` +
      `*GST (${record.gstRate}%):* ₹${record.totalTax.toLocaleString('en-IN')}\n` +
      `*Net Grand Total:* ₹${record.netPayable.toLocaleString('en-IN')}\n` +
      `*Amount Paid:* ₹${record.paid.toLocaleString('en-IN')}\n` +
      `*Pending Balance Due:* ₹${record.pending.toLocaleString('en-IN')}\n` +
      `--------------------------\n` +
      `*Payment Mode:* ${record.paymentMode}\n` +
      `*Testing Warranty:* 3 Days\n` +
      `Shop Contact: +91 85085 50847\n` +
      `No. 1/A Rengarajan street, Boss veedhi, Sellur, Madurai - 625002\n\n` +
      `_Thank you for choosing DREAM FOCUS PROJECTORS! Attached is your verified bill._`;
  };

  const openDirectCustomerWhatsApp = () => {
    const record = saveCurrentOrder();
    const cleanPhone = (billMeta.custPhone || '').replace(/\D/g, '').slice(-10);
    if (!cleanPhone || cleanPhone.length < 10) {
      alert("Please enter a valid 10-digit WhatsApp phone number for the customer!");
      return;
    }
    const text = buildWhatsAppText(record);
    window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
  };

  // Reliable PDF Generator & Share
  const sharePDFDirectly = async () => {
    const record = saveCurrentOrder();
    const cleanPhone = (billMeta.custPhone || '').replace(/\D/g, '').slice(-10);
    const invoiceElem = document.getElementById('printable-invoice');
    if (!invoiceElem) return;

    const wasHidden = invoiceElem.classList.contains('hidden');
    if (wasHidden) {
      invoiceElem.classList.remove('hidden');
      invoiceElem.style.display = 'block';
      invoiceElem.style.position = 'fixed';
      invoiceElem.style.top = '0';
      invoiceElem.style.left = '0';
      invoiceElem.style.width = '800px';
      invoiceElem.style.zIndex = '99999';
      invoiceElem.style.backgroundColor = '#ffffff';
    }

    const opt = {
      margin: [4, 4, 4, 4],
      filename: `${billMeta.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    try {
      const pdfBlob = await html2pdf().set(opt).from(invoiceElem).output('blob');
      
      if (wasHidden) {
        invoiceElem.classList.add('hidden');
        invoiceElem.style.display = '';
        invoiceElem.style.position = '';
        invoiceElem.style.top = '';
        invoiceElem.style.left = '';
        invoiceElem.style.width = '';
        invoiceElem.style.zIndex = '';
        invoiceElem.style.backgroundColor = '';
      }

      const pdfFile = new File([pdfBlob], `${record.invNo.replace(/\//g, '_')}.pdf`, { type: 'application/pdf' });
      const waMessage = buildWhatsAppText(record);

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({
          files: [pdfFile],
          title: `Tax Invoice ${record.invNo}`,
          text: waMessage
        });
      } else {
        const url = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${record.invNo.replace(/\//g, '_')}.pdf`;
        a.click();
        URL.revokeObjectURL(url);

        if (cleanPhone && cleanPhone.length === 10) {
          window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(waMessage)}`, '_blank');
        } else {
          alert('PDF downloaded! Enter customer phone number to open direct WhatsApp chat.');
        }
      }
    } catch (err) {
      console.error(err);
      if (wasHidden) invoiceElem.classList.add('hidden');
      window.print();
    }
  };

  // Audit Modal PDF & WhatsApp Sharing
  const printOrShareAuditInvoice = async (inv, isWhatsApp = false) => {
    const element = document.getElementById('audit-modal-printable');
    if (!element) return;

    const opt = {
      margin: [4, 4, 4, 4],
      filename: `${inv.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    try {
      const cleanPhone = (inv.custPhone || '').replace(/\D/g, '').slice(-10);
      const waText = buildWhatsAppText(inv);

      if (isWhatsApp) {
        const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
        const pdfFile = new File([pdfBlob], `${inv.invNo.replace(/\//g, '_')}.pdf`, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
          await navigator.share({
            files: [pdfFile],
            title: `Invoice ${inv.invNo}`,
            text: waText
          });
        } else {
          const url = URL.createObjectURL(pdfBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${inv.invNo.replace(/\//g, '_')}.pdf`;
          a.click();
          URL.revokeObjectURL(url);

          if (cleanPhone && cleanPhone.length === 10) {
            window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(waText)}`, '_blank');
          }
        }
      } else {
        html2pdf().set(opt).from(element).save();
      }
    } catch (e) {
      console.error(e);
      window.print();
    }
  };

  const resetForm = () => {
    setBillMeta({
      invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
      date: new Date().toISOString().slice(0, 10),
      custName: '', custPhone: '', custAddr: '', custGstin: '',
      paymentStatus: 'Advance Paid', paymentMode: 'GPay / PhonePe UPI'
    });
    setItems([{ id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
    setPricing({ discount: 0, exchange: 0, gstRate: 18, advance: 0 });
  };

  // Filtered Analytics Data
  const filteredHistory = useMemo(() => {
    return history.filter(h => {
      if (!h.date) return true;
      const [y] = h.date.split('-');
      return (analyticsYear === 'ALL' || y === analyticsYear);
    });
  }, [history, analyticsYear]);

  const kpis = useMemo(() => {
    return filteredHistory.reduce((acc, curr) => {
      acc.sales += curr.netPayable || 0;
      acc.taxable += curr.taxableAmount || 0;
      acc.gst += curr.totalTax || 0;
      acc.collected += Number(curr.paid) || 0;
      acc.pending += Number(curr.pending) || 0;
      return acc;
    }, { sales: 0, taxable: 0, gst: 0, collected: 0, pending: 0 });
  }, [filteredHistory]);

  const monthlyMatrix = useMemo(() => {
    const monthCodes = ["01","02","03","04","05","06","07","08","09","10","11","12"];
    const monthLabels = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    return monthCodes.map((m, i) => {
      const records = history.filter(h => {
        if (!h.date) return false;
        const [y, rowM] = h.date.split('-');
        return (analyticsYear === 'ALL' || y === analyticsYear) && rowM === m;
      });

      return {
        code: m,
        name: monthLabels[i],
        orders: records.length,
        sales: records.reduce((s, r) => s + (r.netPayable || 0), 0),
        gst: records.reduce((s, r) => s + (r.totalTax || 0), 0),
        collected: records.reduce((s, r) => s + (Number(r.paid) || 0), 0),
        pending: records.reduce((s, r) => s + (Number(r.pending) || 0), 0)
      };
    });
  }, [history, analyticsYear]);

  // Chart.js Graphs
  useEffect(() => {
    if (tab !== 'reports') return;

    if (barChartInst.current) barChartInst.current.destroy();
    if (pieChartInst.current) pieChartInst.current.destroy();
    if (modeChartInst.current) modeChartInst.current.destroy();

    if (barChartRef.current) {
      const ctx = barChartRef.current.getContext('2d');
      barChartInst.current = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: monthlyMatrix.map(m => m.name),
          datasets: [
            { label: 'Gross Sales (₹)', data: monthlyMatrix.map(m => m.sales), backgroundColor: '#0284c7', borderRadius: 4 },
            { label: 'Cash/UPI Collected (₹)', data: monthlyMatrix.map(m => m.collected), backgroundColor: '#16a34a', borderRadius: 4 },
            { label: 'Pending Due (₹)', data: monthlyMatrix.map(m => m.pending), backgroundColor: '#dc2626', borderRadius: 4 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11, weight: 'bold' } } }
          }
        }
      });
    }

    if (pieChartRef.current) {
      const ctx = pieChartRef.current.getContext('2d');
      pieChartInst.current = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Paid Realized', 'Pending Due'],
          datasets: [{
            data: [kpis.collected, kpis.pending],
            backgroundColor: ['#16a34a', '#dc2626'],
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10, weight: 'bold' } } } }
        }
      });
    }

    if (modeChartRef.current) {
      const ctx = modeChartRef.current.getContext('2d');
      const modesMap = {};
      filteredHistory.forEach(h => {
        const mode = h.paymentMode || 'Other';
        modesMap[mode] = (modesMap[mode] || 0) + (Number(h.paid) || 0);
      });

      modeChartInst.current = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(modesMap).length ? Object.keys(modesMap) : ['No Data'],
          datasets: [{
            data: Object.values(modesMap).length ? Object.values(modesMap) : [1],

                  <p>• Free diagnostic testing for future maintenance, filters, and bulb servicing[span_14](start_span)[span_14](end_span).</p>
                  <p className="text-slate-500">• Note: Power ballast burn and physical water damage are excluded.</p>
                  <div className="pt-2 text-slate-600 font-semibold border-t border-sky-200">
                    Payment Method: <strong className="text-slate-900">{auditPreviewInvoice.paymentMode}</strong>
                  </div>
                </div>

                <div className="bg-slate-50 p-3.5 rounded-md border border-slate-200 text-xs space-y-1.5 font-medium">
                  <div className="flex justify-between text-slate-600">
                    <span>Taxable Value:</span>
                    <span>₹{(auditPreviewInvoice.taxableAmount || 0).toLocaleString('en-IN')}</span>
                  </div>
                  {(Number(auditPreviewInvoice.gstRate) || 0) > 0 && (
                    <div className="flex justify-between text-purple-700">
                      <span>Total GST Tax ({auditPreviewInvoice.gstRate}%):</span>
                      <span>₹{(auditPreviewInvoice.totalTax || 0).toLocaleString('en-IN')}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-slate-900 font-black border-t pt-1 text-sm">
                    <span>Net Total:</span>
                    <span>₹{(auditPreviewInvoice.netPayable || 0).toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between text-emerald-700 font-bold">
                    <span>Amount Paid:</span>
                    <span>₹{(Number(auditPreviewInvoice.paid) || 0).toLocaleString('en-IN')}</span>
                  </div>
                  <div className={`flex justify-between font-black border-t pt-1 text-sm ${(Number(auditPreviewInvoice.pending) || 0) === 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    <span>{(Number(auditPreviewInvoice.pending) || 0) === 0 ? 'PAID IN FULL' : 'PENDING BALANCE:'}</span>
                    <span>₹{(Number(auditPreviewInvoice.pending) || 0).toLocaleString('en-IN')}</span>
                  </div>
                </div>
              </div>

              {/* Thank-You Section inside Modal */}
              <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-center mb-4">
                <div className="text-xs font-bold text-slate-800">
                  ✨ Thank you for choosing DREAM FOCUS PROJECTORS[span_15](start_span)[span_15](end_span)!
                </div>
                <div className="text-[10px] text-slate-500 mt-0.5">
                  We appreciate your business & trust. For queries, replacement lamps, or service bookings, contact: <strong>+91 85085 50847</strong>[span_16](start_span)[span_16](end_span)
                </div>
              </div>

              <div className="flex justify-between items-end border-t border-slate-300 pt-3">
                <div className="text-[11px] text-slate-500">
                  <p className="font-semibold text-slate-700">DREAM FOCUS PROJECTORS[span_17](start_span)[span_17](end_span)</p>
                  <p>No. 1/A Rengarajan street, Boss veedhi, Sellur, Madurai - 625002[span_18](start_span)[span_18](end_span)</p>
                </div>
                <div className="flex items-center gap-6">
                  <RubberStamp isPaid={(Number(auditPreviewInvoice.pending) || 0) === 0} />
                  <DigitalSignature />
                </div>
              </div>
            </div>

            <div className="mt-4 flex flex-wrap gap-2 justify-end">
              <button 
                onClick={() => printOrShareAuditInvoice(auditPreviewInvoice, true)}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 shadow">
                💬 Share PDF to Customer WhatsApp
              </button>
              <button 
                onClick={() => printOrShareAuditInvoice(auditPreviewInvoice, false)}
                className="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 shadow">
                🖨️ Download / Print PDF
              </button>
              <button 
                onClick={() => setAuditPreviewInvoice(null)}
                className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-lg text-xs">
                ✕ Close
              </button>
            </div>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
