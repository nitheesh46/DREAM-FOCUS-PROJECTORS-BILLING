<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- Vector Logo ---

// --- Handwritten Signature ---
const DigitalSignature = () => (
  <div className="text-right flex flex-col items-end" style={{ minWidth: '140px' }}>
    <span className="text-[9px] text-slate-500 font-semibold mb-0.5">Authorized Signatory</span>
    <div style={{ width: '135px', height: '38px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        viewBox="0 0 180 60"

        style={{ display: 'block', overflow: 'visible' }}
      >
        <path d="M 22,42 L 30,22 L 34,35 L 40,23 L 42,40 C 44,46 54,47 62,39" stroke="#0f172a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
        <path d="M 62,39 L 75,10 L 67,46 C 68,36 72,22 76,17 L 71,44" stroke="#0f172a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
        <path d="M 71,36 Q 76,31 80,33 Q 85,30 89,33 L 95,31 Q 104,30 148,27 L 165,25 L 152,33" stroke="#0f172a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none" />
        <path d="M 72,38 L 105,36" stroke="#0f172a" strokeWidth="1.8" strokeLinecap="round" fill="none" />
        <circle cx="118" cy="35" r="1.6" fill="#0f172a" />

      </svg>
    </div>
    <div className="text-[10px] font-bold text-slate-900 border-t border-slate-900 pt-0.5 w-36 text-center">
      M. KANAGAVEL (Proprietor)
    </div>
  </div>
);

// Starter Seed Records
const DEFAULT_RECORDS = [
  {
    invNo: "DFP/2026/1012", date: "2026-06-12", custName: "Senthil Nathan", custPhone: "9842100001", custAddr: "KK Nagar, Madurai",
    paymentStatus: "Full Paid", paymentMode: "GPay / PhonePe UPI",
    items: [{ id: 1, desc: "Epson EB-X41 Pre-Owned Projector", category: "Sales Unit", qty: 1, rate: 14000 }],
    grossTotal: 14000, discount: 500, exchange: 0, taxableAmount: 13500, gstRate: 18, cgst: 1215, sgst: 1215, totalTax: 2430, netPayable: 15930, paid: 15930, pending: 0
  },
  {
    invNo: "DFP/2026/1045", date: "2026-07-20", custName: "Velmurugan Arts Academy", custPhone: "9842100002", custAddr: "Sellur, Madurai",
    paymentStatus: "Advance Paid", paymentMode: "Bank Transfer / NEFT",
    items: [
      { id: 1, desc: "Sony 5000 Lumens Auditorium Projector", category: "Sales Unit", qty: 1, rate: 24000 },
      { id: 2, desc: "Optical Prism Alignment & Deep Clean", category: "Service", qty: 1, rate: 1800 }
    ],
    grossTotal: 25800, discount: 800, exchange: 2000, taxableAmount: 23000, gstRate: 18, cgst: 2070, sgst: 2070, totalTax: 4140, netPayable: 27140, paid: 15000, pending: 12140
  }
];

const encodeHiddenCreds = (u, p) => btoa(encodeURIComponent(`${u}:::${p}`));
const decodeHiddenCreds = (str) => {
  try {
    const [u, p] = decodeURIComponent(atob(str)).split(':::');
    return { user: u || '', pass: p || '' };
  } catch {
    return { user: 'Nitheesh', pass: 'Dreamfocusprojector2026' };
  }
};

function App() {
  const [isAuthenticated, setIsAuthenticated] = useState(() => {
    return localStorage.getItem('DFP_USER_SESSION') === 'true';
  });

  const savedCreds = useMemo(() => {
    const raw = localStorage.getItem('DFP_HIDDEN_AUTH');
    return raw ? decodeHiddenCreds(raw) : { user: 'Nitheesh', pass: 'Dreamfocusprojector2026' };
  }, []);

  const [loginUser, setLoginUser] = useState(() => savedCreds.user);
  const [loginPass, setLoginPass] = useState(() => savedCreds.pass);
  const [rememberMe, setRememberMe] = useState(true);
  const [showPassword, setShowPassword] = useState(false);
  const [loginError, setLoginError] = useState('');

  const [tab, setTab] = useState('create');
  const [auditPreviewInvoice, setAuditPreviewInvoice] = useState(null);
  const [saveToast, setSaveToast] = useState(null); // Visual Confirmation Alert
  const invoiceRef = useRef(null);

  // Security PIN State
  const [adminPin, setAdminPin] = useState(() => localStorage.getItem('DFP_SECURITY_PIN') || '8508');
  const [deleteTargetInv, setDeleteTargetInv] = useState(null);
  const [inputPin, setInputPin] = useState('');
  const [pinErrorMessage, setPinErrorMessage] = useState('');
  const [showChangePinModal, setShowChangePinModal] = useState(false);
  const [newPinInput, setNewPinInput] = useState('');

  // Chart References
  const barChartRef = useRef(null);
  const pieChartRef = useRef(null);
  const modeChartRef = useRef(null);
  const barChartInst = useRef(null);
  const pieChartInst = useRef(null);
  const modeChartInst = useRef(null);

  // Form State
  const [billMeta, setBillMeta] = useState({
    invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
    date: new Date().toISOString().slice(0, 10),
    custName: '',
    custPhone: '',
    custAddr: '',
    custGstin: '',
    paymentStatus: 'Advance Paid',
    paymentMode: 'GPay / PhonePe UPI'
  });

  const [items, setItems] = useState([
    { id: 1, desc: 'Epson EB-X41 Pre-Owned 3LCD Projector (3600 Lumens)', category: 'Sales Unit', qty: 1, rate: 14500 },
    { id: 2, desc: 'Original Remote Control + High Quality HDMI Cable Kit', category: 'Accessory', qty: 1, rate: 0 }
  ]);

  const [pricing, setPricing] = useState({
    discount: 500,
    exchange: 1000,
    gstRate: 18,
    advance: 5000
  });

  // LocalStorage Database
  const [history, setHistory] = useState(() => {
    const saved = localStorage.getItem('DFP_PERFECT_AUDIT_DB');
    return saved ? JSON.parse(saved) : DEFAULT_RECORDS;
  });

  const [analyticsYear, setAnalyticsYear] = useState('2026');
  const [analyticsMonth, setAnalyticsMonth] = useState('ALL');

  useEffect(() => {
    localStorage.setItem('DFP_PERFECT_AUDIT_DB', JSON.stringify(history));
  }, [history]);

  const handleLoginSubmit = (e) => {
    e.preventDefault();
    if (loginUser.trim() === 'Nitheesh' && loginPass === 'Dreamfocusprojector2026') {
      setIsAuthenticated(true);
      localStorage.setItem('DFP_USER_SESSION', 'true');
      if (rememberMe) {
        localStorage.setItem('DFP_HIDDEN_AUTH', encodeHiddenCreds(loginUser.trim(), loginPass));
      } else {
        localStorage.removeItem('DFP_HIDDEN_AUTH');
      }
      setLoginError('');
    } else {
      setLoginError('❌ Invalid Username or Password.');
    }
  };

  const handleLogout = () => {
    if (confirm("Are you sure you want to log out?")) {
      setIsAuthenticated(false);
      localStorage.removeItem('DFP_USER_SESSION');
    }
  };

  // Live Calculations
  const grossTotal = useMemo(() => items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.rate) || 0), 0), [items]);
  const taxableAmount = useMemo(() => Math.max(0, grossTotal - (Number(pricing.discount) || 0) - (Number(pricing.exchange) || 0)), [grossTotal, pricing.discount, pricing.exchange]);
  
  const gstBreakdown = useMemo(() => {
    const rate = Number(pricing.gstRate) || 0;
    const totalTax = (taxableAmount * rate) / 100;
    return {
      rate,
      cgst: totalTax / 2,
      sgst: totalTax / 2,
      totalTax,
      netPayable: Math.round(taxableAmount + totalTax)
    };
  }, [taxableAmount, pricing.gstRate]);

  const pendingDue = useMemo(() => {
    const paidVal = pricing.advance === '' ? 0 : Number(pricing.advance);
    return Math.max(0, gstBreakdown.netPayable - paidVal);
  }, [gstBreakdown.netPayable, pricing.advance]);

  // Payment Status Handlers
  const handleStatusChange = (status) => {
    setBillMeta(prev => ({ ...prev, paymentStatus: status }));
    if (status === 'Full Paid') {
      setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
    } else if (status === 'Pending (Zero Advance)') {
      setPricing(prev => ({ ...prev, advance: 0 }));
    } else if (status === 'Advance Paid') {
      if (Number(pricing.advance) >= gstBreakdown.netPayable || Number(pricing.advance) === 0) {
        const half = Math.round(gstBreakdown.netPayable / 2);
        setPricing(prev => ({ ...prev, advance: half > 0 ? half : 5000 }));
      }
    }
  };

  const handlePayFull = () => {
    setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
    setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
  };

  const handleSetAdvance = () => {
    setBillMeta(prev => ({ ...prev, paymentStatus: 'Advance Paid' }));
    if (Number(pricing.advance) >= gstBreakdown.netPayable || Number(pricing.advance) === 0) {
      const half = Math.round(gstBreakdown.netPayable / 2);
      setPricing(prev => ({ ...prev, advance: half > 0 ? half : 5000 }));
    }
  };

  const handleAmountPaidInput = (e) => {
    const val = e.target.value === '' ? '' : Number(e.target.value);
    setPricing(prev => ({ ...prev, advance: val }));
    const num = val === '' ? 0 : val;
    if (num >= gstBreakdown.netPayable && gstBreakdown.netPayable > 0) {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
    } else if (num === 0) {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Pending (Zero Advance)' }));
    } else {
      setBillMeta(prev => ({ ...prev, paymentStatus: 'Advance Paid' }));
    }
  };

  const addItem = () => setItems([...items, { id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, val) => setItems(items.map(i => i.id === id ? { ...i, [field]: val } : i));

  // Save Order Record with Visual Confirmation Toast
  const saveCurrentOrder = (showToastNotice = true) => {
    const record = {
      ...billMeta,
      items,
      grossTotal,
      discount: Number(pricing.discount) || 0,
      exchange: Number(pricing.exchange) || 0,
      taxableAmount,
      gstRate: gstBreakdown.rate,
      cgst: gstBreakdown.cgst,
      sgst: gstBreakdown.sgst,
      totalTax: gstBreakdown.totalTax,
      netPayable: gstBreakdown.netPayable,
      paid: pricing.advance === '' ? 0 : Number(pricing.advance),
      pending: pendingDue,
      timestamp: Date.now()
    };

    setHistory(prev => {
      const idx = prev.findIndex(p => p.invNo === billMeta.invNo);
      return idx >= 0 ? prev.map((p, i) => i === idx ? record : p) : [record, ...prev];
    });

    if (showToastNotice) {
      setSaveToast({
        invNo: record.invNo,
        custName: record.custName || 'Walk-in Customer',
        amount: record.netPayable
      });
      setTimeout(() => setSaveToast(null), 4000);
    }

    return record;
  };

  const handleRequestDelete = (invNo) => {
    setDeleteTargetInv(invNo);
    setInputPin('');
    setPinErrorMessage('');
  };

  const handleConfirmDelete = () => {
    if (inputPin.trim() === adminPin.trim()) {
      setHistory(prev => prev.filter(h => h.invNo !== deleteTargetInv));
      setDeleteTargetInv(null);
      setInputPin('');
      setPinErrorMessage('');
    } else {
      setPinErrorMessage('❌ Incorrect PIN! Cannot delete this invoice.');
    }
  };

  const handleSaveNewPin = () => {
    if (newPinInput.trim().length >= 4) {
      setAdminPin(newPinInput.trim());
      localStorage.setItem('DFP_SECURITY_PIN', newPinInput.trim());
      setShowChangePinModal(false);
      setNewPinInput('');
      alert('Security PIN updated successfully!');
    } else {
      alert('PIN must be at least 4 characters long.');
    }
  };

  const buildWhatsAppText = (record) => {
    return `*DREAM FOCUS PROJECTORS - TAX INVOICE*\n` +
      `*Invoice No:* ${record.invNo}\n` +
      `*Customer:* ${record.custName || 'Valued Customer'}\n` +
      `*Date:* ${record.date}\n` +
      `--------------------------\n` +
      `*Gross Total:* ₹${record.grossTotal.toLocaleString('en-IN')}\n` +
      (record.discount > 0 ? `*Discount:* -₹${record.discount.toLocaleString('en-IN')}\n` : '') +
      (record.exchange > 0 ? `*Exchange:* -₹${record.exchange.toLocaleString('en-IN')}\n` : '') +
      `*Taxable Value:* ₹${record.taxableAmount.toLocaleString('en-IN')}\n` +
      `*GST (${record.gstRate}%):* ₹${record.totalTax.toLocaleString('en-IN')}\n` +
      `*Net Grand Total:* ₹${record.netPayable.toLocaleString('en-IN')}\n` +
      `*Payment Mode:* ${record.paymentMode}\n` +
      `*Amount Paid:* ₹${record.paid.toLocaleString('en-IN')}\n` +
      `*Pending Due:* ₹${record.pending.toLocaleString('en-IN')}\n` +
      `--------------------------\n` +
      `*Testing Warranty:* 3 Days\n` +
      `Shop Contact: +91 85085 50847\n` +
      `No. 1/A Rengarajan street, Boss veedhi, Sellur, Madurai - 625002\n\n` +
      `_Thank you for choosing DREAM FOCUS PROJECTORS! Attached is your bill._`;
  };

  // --- POPUP-BLOCKER-SAFE DIRECT WHATSAPP DISPATCHER ---
  const launchWhatsAppDirect = (phone, text) => {
    const cleanPhone = (phone || '').replace(/\D/g, '').slice(-10);
    if (!cleanPhone || cleanPhone.length < 10) {
      alert("Please enter a valid 10-digit WhatsApp phone number for the customer!");
      return;
    }

    const whatsappUrl = `https://api.whatsapp.com/send?phone=91${cleanPhone}&text=${encodeURIComponent(text)}`;
    
    // Synthetic link element bypasses pop-up blockers in Chrome/Safari/Brave
    const a = document.createElement('a');
    a.href = whatsappUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const openDirectCustomerWhatsApp = () => {
    const record = saveCurrentOrder(true);
    const text = buildWhatsAppText(record);
    launchWhatsAppDirect(record.custPhone, text);
  };

  // Strictly 1-Page PDF Generator
  const sharePDFDirectly = async () => {
    const record = saveCurrentOrder(true);
    const invoiceElem = document.getElementById('printable-invoice');
    if (!invoiceElem) return;

    const opt = {
      margin: 0,
      filename: `${billMeta.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: 'avoid-all' }
    };

    try {
      const pdfBlob = await html2pdf().set(opt).from(invoiceElem).output('blob');
      const pdfFile = new File([pdfBlob], `${record.invNo.replace(/\//g, '_')}.pdf`, { type: 'application/pdf' });
      const waMessage = buildWhatsAppText(record);

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({
          files: [pdfFile],
          title: `Tax Invoice ${record.invNo}`,
          text: waMessage
        });
      } else {
        const url = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${record.invNo.replace(/\//g, '_')}.pdf`;
        a.click();
        URL.revokeObjectURL(url);

        // Directly open WhatsApp after download
        launchWhatsAppDirect(record.custPhone, waMessage);
      }
    } catch (err) {
      console.error(err);
      window.print();
    }
  };

  const printOrShareAuditInvoice = async (inv, isWhatsApp = false) => {
    const element = document.getElementById('audit-modal-printable');
    if (!element) return;

    const opt = {
      margin: 0,
      filename: `${inv.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: 'avoid-all' }
    };

    try {
      const waText = buildWhatsAppText(inv);

      if (isWhatsApp) {
        launchWhatsAppDirect(inv.custPhone, waText);
      } else {
        html2pdf().set(opt).from(element).save();
      }
    } catch (e) {
      console.error(e);
      window.print();
    }
  };

  const resetForm = () => {
    setBillMeta({
      invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
      date: new Date().toISOString().slice(0, 10),
      custName: '', custPhone: '', custAddr: '', custGstin: '',
      paymentStatus: 'Advance Paid', paymentMode: 'GPay / PhonePe UPI'
    });
    setItems([{ id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
    setPricing({ discount: 0, exchange: 0, gstRate: 18, advance: 0 });
  };

  const filteredHistory = useMemo(() => {
    return history.filter(h => {
      if (!h.date) return true;
      const [y, m] = h.date.split('-');
      const matchYear = analyticsYear === 'ALL' || y === analyticsYear;
      const matchMonth = analyticsMonth === 'ALL' || m === analyticsMonth;
      return matchYear && matchMonth;
    });
  }, [history, analyticsYear, analyticsMonth]);

  const kpis = useMemo(() => {
    return filteredHistory.reduce((acc, curr) => {
      acc.sales += curr.netPayable || 0;
      acc.taxable += curr.taxableAmount || 0;
      acc.gst += curr.totalTax || 0;
      acc.collected += Number(curr.paid) || 0;
      acc.pending += Number(curr.pending) || 0;
      return acc;
    }, { sales: 0, taxable: 0, gst: 0, collected: 0, pending: 0 });
  }, [filteredHistory]);

  const monthlyMatrix = useMemo(() => {
    const monthCodes = ["01","02","03","04","05","06","07","08","09","10","11","12"];
    const monthLabels = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    return monthCodes.map((m, i) => {
      const records = history.filter(h => {
        if (!h.date) return false;
        const [y, rowM] = h.date.split('-');
        return (analyticsYear === 'ALL' || y === analyticsYear) && rowM === m;
      });

      return {
        code: m,
        name: monthLabels[i],
        orders: records.length,
        sales: records.reduce((s, r) => s + (r.netPayable || 0), 0),
        gst: records.reduce((s, r) => s + (r.totalTax || 0), 0),
        collected: records.reduce((s, r) => s + (Number(r.paid) || 0), 0),
        pending: records.reduce((s, r) => s + (Number(r.pending) || 0), 0)
      };
    });
  }, [history, analyticsYear]);

  const paymentModesMap = useMemo(() => {
    const map = {};
    filteredHistory.forEach(h => {
      const mode = h.paymentMode || 'Other';
      map[mode] = (map[mode] || 0) + (Number(h.paid) || 0);
    });
    return map;

                  <div className="flex justify-between text-slate-900 font-black border-t pt-0.5 text-[10px]">
                    <span>Net Total:</span>
                    <span>₹{(auditPreviewInvoice.netPayable || 0).toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between text-slate-700 font-semibold">
                    <span>Mode:</span>
                    <span>{auditPreviewInvoice.paymentMode}</span>
                  </div>
                  <div className="flex justify-between text-emerald-700 font-bold">
                    <span>Paid:</span>
                    <span>₹{(Number(auditPreviewInvoice.paid) || 0).toLocaleString('en-IN')}</span>
                  </div>
                  <div className={`flex justify-between font-black border-t pt-0.5 text-[10px] ${(Number(auditPreviewInvoice.pending) || 0) === 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                    <span>{(Number(auditPreviewInvoice.pending) || 0) === 0 ? 'PAID IN FULL' : 'DUE:'}</span>
                    <span>₹{(Number(auditPreviewInvoice.pending) || 0).toLocaleString('en-IN')}</span>
                  </div>
                </div>
              </div>

              {/* Thank You Note */}
              <div className="bg-slate-50 border border-slate-200 rounded p-1 text-center mb-2">
                <div className="text-[10px] font-bold text-slate-800">
                  ✨ Thank you for choosing DREAM FOCUS PROJECTORS!
                </div>
                <div className="text-[8.5px] text-slate-500">
                  Phone: <strong>+91 85085 50847</strong> | Sellur, Madurai - 625002
                </div>
              </div>

              <div className="flex justify-between items-end border-t border-slate-300 pt-1.5">
                <div className="text-[9px] text-slate-500">
                  <p className="font-semibold text-slate-700">DREAM FOCUS PROJECTORS</p>
                  <p>Madurai Branch</p>
                </div>
                <div className="flex items-center gap-3">
                  <RubberStamp isPaid={(Number(auditPreviewInvoice.pending) || 0) === 0} />
                  <DigitalSignature />
                </div>
              </div>
            </div>

            <div className="mt-2.5 flex flex-wrap gap-1.5 justify-end">
              <button 
                onClick={() => printOrShareAuditInvoice(auditPreviewInvoice, true)}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2.5 py-1 rounded text-xs flex items-center gap-1 shadow">
                💬 Direct Customer WhatsApp
              </button>
              <button 
                onClick={() => printOrShareAuditInvoice(auditPreviewInvoice, false)}
                className="bg-sky-600 hover:bg-sky-700 text-white font-bold px-2.5 py-1 rounded text-xs flex items-center gap-1 shadow">
                🖨️ Download
              </button>
              <button 
                onClick={() => setAuditPreviewInvoice(null)}
                className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-2.5 py-1 rounded text-xs">
                ✕ Close
              </button>
            </div>

          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
