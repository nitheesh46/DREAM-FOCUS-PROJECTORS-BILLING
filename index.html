<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DREAM FOCUS PROJECTORS - Smart Mobile & Laptop Billing</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- HTML2PDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @page { size: A4; margin: 6mm; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      #printable-invoice { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24 md:pb-10">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- Vector Logo & Brand Graphics ---
const ProjectorLogo = () => (
  <svg className="w-11 h-11 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="20" fill="#0284C7"/>
    <rect x="15" y="38" width="55" height="30" rx="6" fill="#FFFFFF"/>
    <circle cx="35" cy="53" r="9" fill="#0F172A" stroke="#38BDF8" strokeWidth="3"/>
    <circle cx="35" cy="53" r="4" fill="#F59E0B"/>
    <path d="M68 46L90 32V74L68 60V46Z" fill="#F59E0B" opacity="0.9"/>
    <line x1="52" y1="45" x2="52" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <line x1="58" y1="45" x2="58" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <rect x="22" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="54" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
  </svg>
);

const RubberStamp = ({ isPaid }) => (
  <div className="w-24 h-24 rounded-full border-4 border-double border-blue-800 text-blue-900 p-2 flex flex-col items-center justify-center -rotate-12 select-none opacity-85 shadow-[0_0_0_1px_#1e40af] bg-blue-50/20">
    <span className="text-[6.5px] font-black tracking-widest text-center leading-tight uppercase">★ DREAM FOCUS ★<br/>PROJECTORS</span>
    <span className={`text-[9.5px] font-extrabold border-y-2 border-blue-800 my-0.5 px-2 tracking-wider uppercase ${isPaid ? 'text-emerald-700' : 'text-amber-700'}`}>
      {isPaid ? 'PAID FULL' : 'ADVANCE RECVD'}
    </span>
    <span className="text-[6.5px] font-bold tracking-wider">MADURAI - 625002</span>
  </div>
);

const DigitalSignature = () => (
  <div className="text-right flex flex-col items-end">
    <span className="text-[10px] text-slate-500 font-semibold mb-0.5">Authorized Signatory</span>
    <svg className="w-32 h-9" viewBox="0 0 200 60" fill="none">
      <path d="M15 42 C 25 15, 35 10, 42 35 C 48 50, 52 20, 65 28 C 75 35, 80 22, 92 32 C 100 38, 110 18, 125 35 C 135 45, 140 15, 155 30 C 165 40, 175 25, 185 32" stroke="#0f172a" strokeWidth="2.5" strokeLinecap="round"/>
      <path d="M10 48 Q 90 52 190 44" stroke="#0f172a" strokeWidth="2" strokeLinecap="round"/>
    </svg>
    <div className="text-[11px] font-bold text-slate-900 border-t border-slate-900 pt-0.5 w-40 text-center">
      M. KANAGAVEL (Proprietor)
    </div>
  </div>
);

function App() {
  const [tab, setTab] = useState('create'); // 'create' | 'reports'
  const [deviceMode, setDeviceMode] = useState(() => window.innerWidth < 768 ? 'mobile' : 'laptop');
  const [showPreviewModal, setShowPreviewModal] = useState(false);
  const invoiceRef = useRef(null);

  // Form State
  const [billMeta, setBillMeta] = useState({
    invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
    date: new Date().toISOString().slice(0, 10),
    custName: '',
    custPhone: '',
    custAddr: '',
    custGstin: '',
    shopGstin: '33AABFD1234F1Z5',
    paymentStatus: 'Advance Paid',
    paymentMode: 'GPay / PhonePe UPI'
  });

  const [items, setItems] = useState([
    { id: 1, desc: 'Epson EB-X41 Pre-Owned 3LCD Projector (3600 Lumens)', category: 'Sales Unit', qty: 1, rate: 14500 },
    { id: 2, desc: 'Original Remote Control + High Quality HDMI Cable Kit', category: 'Accessory', qty: 1, rate: 0 }
  ]);

  const [pricing, setPricing] = useState({
    discount: 500,
    exchange: 1000,
    gstRate: 18,
    advance: 5000
  });

  // LocalStorage Database
  const [history, setHistory] = useState(() => {
    const saved = localStorage.getItem('DFP_HYBRID_BILLS_V1');
    return saved ? JSON.parse(saved) : [];
  });

  const [analyticsYear, setAnalyticsYear] = useState('2026');

  useEffect(() => {
    localStorage.setItem('DFP_HYBRID_BILLS_V1', JSON.stringify(history));
  }, [history]);

  // Handle Window Resize for Auto Detection
  useEffect(() => {
    const handleResize = () => {
      if (!localStorage.getItem('DFP_USER_MODE_PREF')) {
        setDeviceMode(window.innerWidth < 768 ? 'mobile' : 'laptop');
      }
    };
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  const toggleDeviceMode = (mode) => {
    setDeviceMode(mode);
    localStorage.setItem('DFP_USER_MODE_PREF', mode);
  };

  // Calculations
  const grossTotal = useMemo(() => items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.rate) || 0), 0), [items]);
  const taxableAmount = useMemo(() => Math.max(0, grossTotal - (Number(pricing.discount) || 0) - (Number(pricing.exchange) || 0)), [grossTotal, pricing.discount, pricing.exchange]);
  
  const gstBreakdown = useMemo(() => {
    const rate = Number(pricing.gstRate) || 0;
    const totalTax = (taxableAmount * rate) / 100;
    return {
      rate,
      cgst: totalTax / 2,
      sgst: totalTax / 2,
      totalTax,
      netPayable: Math.round(taxableAmount + totalTax)
    };
  }, [taxableAmount, pricing.gstRate]);

  const pendingDue = useMemo(() => {
    const paidVal = pricing.advance === '' ? 0 : Number(pricing.advance);
    return Math.max(0, gstBreakdown.netPayable - paidVal);
  }, [gstBreakdown.netPayable, pricing.advance]);

  // Payment Status Sync
  const handleStatusChange = (status) => {
    setBillMeta(prev => ({ ...prev, paymentStatus: status }));
    if (status === 'Full Paid') {
      setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
    } else if (status === 'Pending (Zero Advance)') {
      setPricing(prev => ({ ...prev, advance: 0 }));
    }
  };

  const handlePayFull = () => {
    setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
    setPricing(prev => ({ ...prev, advance: gstBreakdown.netPayable }));
  };

  // Item List Handlers
  const addItem = () => setItems([...items, { id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, val) => setItems(items.map(i => i.id === id ? { ...i, [field]: val } : i));

  // Save Record
  const saveCurrentOrder = () => {
    const record = {
      ...billMeta,
      items,
      grossTotal,
      discount: Number(pricing.discount) || 0,
      exchange: Number(pricing.exchange) || 0,
      taxableAmount,
      gstRate: gstBreakdown.rate,
      cgst: gstBreakdown.cgst,
      sgst: gstBreakdown.sgst,
      totalTax: gstBreakdown.totalTax,
      netPayable: gstBreakdown.netPayable,
      paid: pricing.advance === '' ? 0 : Number(pricing.advance),
      pending: pendingDue,
      timestamp: Date.now()
    };
    setHistory(prev => {
      const idx = prev.findIndex(p => p.invNo === billMeta.invNo);
      return idx >= 0 ? prev.map((p, i) => i === idx ? record : p) : [record, ...prev];
    });
    return record;
  };

  // PDF Export & Native WhatsApp File Share
  const sharePDFDirectly = async () => {
    const record = saveCurrentOrder();
    const opt = {
      margin: 5,
      filename: `${billMeta.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    try {
      const element = invoiceRef.current;
      const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
      const pdfFile = new File([pdfBlob], `${record.invNo.replace(/\//g, '_')}.pdf`, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({
          files: [pdfFile],
          title: `Tax Invoice ${record.invNo}`,
          text: `GST Invoice from DREAM FOCUS PROJECTORS for ${record.custName || 'Customer'}`
        });
      } else {
        html2pdf().set(opt).from(element).save();
        if (record.custPhone) {
          const msg = `*DREAM FOCUS PROJECTORS - TAX INVOICE*\nInvoice: ${record.invNo}\nHi ${record.custName || 'Customer'},\nTaxable: ₹${record.taxableAmount}\nGST (${record.gstRate}%): ₹${record.totalTax}\n*Total Bill:* ₹${record.netPayable}\n*Paid:* ₹${record.paid}\n*Pending Due:* ₹${record.pending}\nContact: +91 85085 50847`;
          window.open(`https://wa.me/91${record.custPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        } else {
          alert('PDF Downloaded! Enter phone number to open WhatsApp.');
        }
      }
    } catch (err) {
      console.error(err);
      window.print();
    }
  };

  // Reset
  const resetForm = () => {
    setBillMeta({
      invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
      date: new Date().toISOString().slice(0, 10),
      custName: '', custPhone: '', custAddr: '', custGstin: '',
      shopGstin: '33AABFD1234F1Z5',
      paymentStatus: 'Advance Paid', paymentMode: 'GPay / PhonePe UPI'
    });
    setItems([{ id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
    setPricing({ discount: 0, exchange: 0, gstRate: 18, advance: 0 });
  };

  return (
    <div className="max-w-5xl mx-auto px-2 sm:px-4 pt-3">
      
      {/* Top Controls: Mode Switcher & Tab Navigation */}
      <div className="no-print space-y-3 mb-4">
        <div className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
          <div className="flex items-center gap-2">
            <ProjectorLogo />
            <div>
              <div className="font-extrabold text-sm text-slate-800 leading-tight">DREAM FOCUS</div>
              <div className="text-[10px] text-slate-500 font-semibold">Madurai Projector Billing</div>
            </div>
          </div>

          {/* Mode Switcher Toggle */}
          <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
            <button 
              onClick={() => toggleDeviceMode('mobile')}
              className={`flex items-center gap-1 text-xs font-bold px-2.5 py-1.5 rounded-md transition ${deviceMode === 'mobile' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
              📱 Mobile Mode
            </button>
            <button 
              onClick={() => toggleDeviceMode('laptop')}
              className={`flex items-center gap-1 text-xs font-bold px-2.5 py-1.5 rounded-md transition ${deviceMode === 'laptop' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
              💻 Laptop Mode
            </button>
          </div>
        </div>

        {/* Section Tabs */}
        <div className="flex gap-2">
          <button 
            onClick={() => setTab('create')}
            className={`flex-1 py-2.5 font-bold rounded-lg text-xs sm:text-sm transition shadow-sm ${tab === 'create' ? 'bg-sky-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'}`}>
            📝 Create Bill
          </button>
          <button 
            onClick={() => setTab('reports')}
            className={`flex-1 py-2.5 font-bold rounded-lg text-xs sm:text-sm transition shadow-sm ${tab === 'reports' ? 'bg-sky-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200'}`}>
            📊 Saved Records ({history.length})
          </button>
        </div>
      </div>

      {tab === 'create' ? (
        <div>
          {/* ========================================================================= */}
          {/* 1. MOBILE FORM MODE (Active when deviceMode === 'mobile') */}
          {/* ========================================================================= */}
          {deviceMode === 'mobile' && (
            <div className="no-print space-y-3">
              
              {/* Customer Box */}
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2.5">
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="font-bold text-xs text-sky-700 uppercase tracking-wide">👤 Customer Details</span>
                  <span className="text-[11px] font-mono text-slate-500">{billMeta.invNo}</span>
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-600">Customer Name</label>
                  <input className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-semibold mt-0.5 outline-none focus:border-sky-600" placeholder="e.g. K. Ramkumar" value={billMeta.custName} onChange={e => setBillMeta({...billMeta, custName: e.target.value})} />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold text-slate-600">WhatsApp Mobile</label>
                    <input type="tel" className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-semibold mt-0.5 outline-none focus:border-sky-600" placeholder="10 digits" value={billMeta.custPhone} onChange={e => setBillMeta({...billMeta, custPhone: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600">Delivery Area</label>
                    <input className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-semibold mt-0.5 outline-none focus:border-sky-600" placeholder="Madurai Area" value={billMeta.custAddr} onChange={e => setBillMeta({...billMeta, custAddr: e.target.value})} />
                  </div>
                </div>
              </div>

              {/* Items Card List (Touch-Optimized Cards for Phones) */}
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="font-bold text-xs text-sky-700 uppercase tracking-wide">📦 Projector Items & Services</span>
                  <button onClick={addItem} className="bg-sky-600 text-white font-bold text-xs px-2.5 py-1 rounded-md">
                    + Add Item
                  </button>
                </div>

                {items.map((item, index) => (
                  <div key={item.id} className="bg-slate-50 border border-slate-200 p-3 rounded-lg space-y-2 relative">
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-[10px] font-black text-white bg-slate-800 rounded px-1.5 py-0.5">#{index + 1}</span>
                      <input 
                        className="flex-1 bg-white border border-slate-300 rounded-md p-2 text-xs font-semibold outline-none focus:border-sky-600" 
                        placeholder="Item / Model / Service" 
                        value={item.desc} 
                        onChange={e => updateItem(item.id, 'desc', e.target.value)} 
                      />
                      {items.length > 1 && (
                        <button onClick={() => removeItem(item.id)} className="text-red-500 font-bold p-1 text-sm">✕</button>
                      )}
                    </div>

                    <div className="grid grid-cols-3 gap-2 items-center">
                      <div>
                        <label className="text-[10px] text-slate-500 font-bold">Category</label>
                        <select className="w-full bg-white border border-slate-300 rounded p-1.5 text-xs font-semibold" value={item.category} onChange={e => updateItem(item.id, 'category', e.target.value)}>
                          <option value="Sales Unit">Sales Unit</option>
                          <option value="Service">Service</option>
                          <option value="Accessory">Accessory</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-500 font-bold">Qty</label>
                        <input type="number" className="w-full bg-white border border-slate-300 rounded p-1.5 text-xs text-center font-bold" value={item.qty} onChange={e => updateItem(item.id, 'qty', e.target.value)} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-500 font-bold">Rate (₹)</label>
                        <input type="number" className="w-full bg-white border border-slate-300 rounded p-1.5 text-xs text-right font-bold" value={item.rate} onChange={e => updateItem(item.id, 'rate', e.target.value)} />
                      </div>
                    </div>

                    <div className="text-right text-xs font-bold text-slate-800 pt-1 border-t border-slate-200">
                      Total: ₹{((Number(item.qty) || 0) * (Number(item.rate) || 0)).toLocaleString('en-IN')}
                    </div>
                  </div>
                ))}
              </div>

              {/* Pricing, GST & Balance */}
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2.5 text-xs">
                <span className="font-bold text-xs text-sky-700 uppercase tracking-wide block border-b pb-1.5">💰 Payment & Tax Details</span>
                
                <div className="flex justify-between items-center py-1">
                  <span className="text-slate-600">Gross Total:</span>
                  <span className="font-bold">₹{grossTotal.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center py-1">
                  <span className="text-slate-600">Festival Discount (₹):</span>
                  <input type="number" className="w-24 text-right bg-slate-50 border rounded p-1.5 font-semibold" value={pricing.discount} onChange={e => setPricing({...pricing, discount: e.target.value})} />
                </div>
                <div className="flex justify-between items-center py-1">
                  <span className="text-slate-600">Old Projector Exchange (₹):</span>
                  <input type="number" className="w-24 text-right bg-slate-50 border rounded p-1.5 font-semibold" value={pricing.exchange} onChange={e => setPricing({...pricing, exchange: e.target.value})} />
                </div>
                <div className="flex justify-between items-center py-1 border-t">
                  <span className="font-bold text-slate-700">Taxable Value:</span>
                  <span className="font-bold">₹{taxableAmount.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center py-1">
                  <span className="text-slate-600">GST Slab:</span>
                  <select className="bg-slate-50 border rounded p-1 font-bold text-sky-900" value={pricing.gstRate} onChange={e => setPricing({...pricing, gstRate: Number(e.target.value)})}>
                    <option value="18">18% (Standard)</option>
                    <option value="28">28%</option>
                    <option value="12">12%</option>
                    <option value="5">5%</option>
                    <option value="0">0% (Exempt)</option>
                  </select>
                </div>
                <div className="flex justify-between items-center py-1.5 bg-slate-50 px-2 rounded font-black text-sm text-slate-900 border">
                  <span>Net Grand Total:</span>
                  <span>₹{gstBreakdown.netPayable.toLocaleString('en-IN')}</span>
                </div>

                {/* Amount Paid / Advance */}
                <div className="flex justify-between items-center py-1 pt-2">
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-sky-800">Amount Paid (₹):</span>
                    <button type="button" onClick={handlePayFull} className="text-[10px] bg-sky-100 border border-sky-300 text-sky-800 font-bold px-1.5 py-0.5 rounded">
                      Pay Full
                    </button>
                  </div>
                  <input type="number" className="w-28 text-right bg-white border-2 border-sky-600 rounded p-1.5 font-black text-sm" value={pricing.advance} onChange={e => {
                    const val = e.target.value === '' ? '' : Number(e.target.value);
                    setPricing({ ...pricing, advance: val });
                    if (val >= gstBreakdown.netPayable && gstBreakdown.netPayable > 0) setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
                  }} />
                </div>

                {/* Pending Balance Due */}
                <div className={`flex justify-between items-center p-2 rounded border font-black text-sm ${pendingDue === 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-red-50 text-red-600 border-red-300'}`}>
                  <span>{pendingDue === 0 ? 'STATUS: PAID FULL' : 'BALANCE DUE:'}</span>
                  <span>₹{pendingDue.toLocaleString('en-IN')}</span>
                </div>

                {/* Payment Mode Selector */}
                <div className="pt-2">
                  <label className="text-[11px] font-bold text-slate-600 block mb-1">Payment Mode:</label>
                  <select className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-bold text-sky-900" value={billMeta.paymentMode} onChange={e => setBillMeta({...billMeta, paymentMode: e.target.value})}>
                    <option value="GPay / PhonePe UPI">📱 GPay / PhonePe / UPI</option>
                    <option value="Cash">💵 Cash</option>
                    <option value="Bank Transfer / NEFT">🏦 Bank Transfer / NEFT</option>
                    <option value="Debit / Credit Card">💳 Debit / Credit Card</option>
                  </select>
                </div>
              </div>

              {/* View Preview Button for Mobile */}
              <div className="flex gap-2">
                <button onClick={() => setShowPreviewModal(true)} className="flex-1 bg-slate-200 text-slate-800 font-bold py-2.5 rounded-lg text-xs flex items-center justify-center gap-1.5">
                  👁️ Preview Print Bill
                </button>
                <button onClick={resetForm} className="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-lg text-xs">
                  🔄 Reset
                </button>
              </div>

              {/* Mobile Fixed Sticky Bottom Action Bar */}
              <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-2.5 flex gap-2 z-40 shadow-lg">
                <button onClick={sharePDFDirectly} className="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-lg text-xs flex items-center justify-center gap-1.5 shadow">
                  📄 Share PDF to WhatsApp
                </button>
                <button onClick={() => { saveCurrentOrder(); window.print(); }} className="bg-sky-600 text-white font-bold px-5 py-3 rounded-lg text-xs shadow">
                  🖨️ Print
                </button>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* 2. LAPTOP VIEW / PRINTABLE INVOICE CANVAS (Always rendered for PDF) */}
          {/* ========================================================================= */}
          <div 
            ref={invoiceRef} 
            id="printable-invoice"
            className={`bg-white rounded-xl shadow-md border border-slate-200 p-6 sm:p-8 ${deviceMode === 'mobile' && !showPreviewModal ? 'hidden md:block' : 'block'}`}>
            
            {/* Header */}
            <div className="bg-gradient-to-r from-slate-900 to-sky-700 text-white p-5 rounded-lg flex justify-between items-center mb-6">
              <div className="flex items-center gap-4">
                <ProjectorLogo />
                <div>
                  <h1 className="text-xl sm:text-2xl font-black tracking-tight leading-none">DREAM FOCUS PROJECTORS</h1>
                  <p className="text-sky-300 text-xs font-semibold tracking-wider uppercase mt-1">Pre-Owned Sales • Chip-Level Repair • Projector Accessories</p>
                  <p className="text-slate-300 text-[11px] mt-0.5">Madurai Branch • Phone: +91 85085 50847 | <strong>GSTIN: {billMeta.shopGstin}</strong></p>
                </div>
              </div>
              <div className="text-right">
                <span className="text-amber-400 font-black text-xl tracking-wider block">TAX INVOICE</span>
                <span className={`text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide inline-block mt-1 ${pendingDue === 0 ? 'bg-emerald-500' : 'bg-amber-500'}`}>
                  {pendingDue === 0 ? 'PAID FULL' : billMeta.paymentStatus.toUpperCase()}
                </span>
              </div>
            </div>

            {/* Customer & Invoice Meta Grid */}
            <div className="grid grid-cols-2 gap-4 bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6 text-xs">
              <div>
                <h3 className="font-bold text-sky-700 uppercase tracking-wider border-b border-slate-200 pb-1 mb-2">Billed To (Customer Details)</h3>
                <div className="space-y-1.5">
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Name:</span>
                    <input className="font-bold flex-1 bg-transparent border-b border-slate-200 outline-none" placeholder="Enter Customer Name" value={billMeta.custName} onChange={e => setBillMeta({...billMeta, custName: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">WhatsApp:</span>
                    <input className="flex-1 bg-transparent border-b border-slate-200 outline-none" placeholder="10-digit number" value={billMeta.custPhone} onChange={e => setBillMeta({...billMeta, custPhone: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Address:</span>
                    <input className="flex-1 bg-transparent border-b border-slate-200 outline-none" placeholder="Madurai Area" value={billMeta.custAddr} onChange={e => setBillMeta({...billMeta, custAddr: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Buyer GSTIN:</span>
                    <input className="flex-1 bg-transparent border-b border-slate-200 outline-none uppercase font-mono" placeholder="Optional GSTIN" value={billMeta.custGstin} onChange={e => setBillMeta({...billMeta, custGstin: e.target.value})} />
                  </div>
                </div>
              </div>

              <div>
                <h3 className="font-bold text-sky-700 uppercase tracking-wider border-b border-slate-200 pb-1 mb-2">Invoice Meta</h3>
                <div className="space-y-1.5">
                  <div className="flex items-center"><span className="w-28 text-slate-500 font-semibold">Invoice No:</span>
                    <input className="font-bold flex-1 bg-transparent border-b border-slate-200 outline-none" value={billMeta.invNo} onChange={e => setBillMeta({...billMeta, invNo: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-28 text-slate-500 font-semibold">Date:</span>
                    <input type="date" className="flex-1 bg-transparent border-b border-slate-200 outline-none" value={billMeta.date} onChange={e => setBillMeta({...billMeta, date: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-28 text-slate-500 font-semibold">Proprietor:</span>
                    <span className="font-semibold text-slate-800">M. KANAGAVEL</span>
                  </div>
                  <div className="flex items-center"><span className="w-28 text-slate-500 font-semibold">Place of Supply:</span>
                    <span className="font-semibold text-slate-800">Tamil Nadu (33)</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Desktop Table View */}
            <div className="overflow-x-auto mb-4">
              <table className="w-full text-left border border-slate-200 text-xs">
                <thead>
                  <tr className="bg-slate-900 text-white uppercase text-[11px]">
                    <th className="p-2.5 text-center w-10">#</th>
                    <th className="p-2.5">Item / Service Description</th>
                    <th className="p-2.5 w-28 text-center">Category</th>
                    <th className="p-2.5 text-center w-16">Qty</th>
                    <th className="p-2.5 text-right w-24">Rate (₹)</th>
                    <th className="p-2.5 text-right w-24">Total (₹)</th>
                    <th className="p-2.5 text-center w-10 no-print"></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {items.map((item, index) => (
                    <tr key={item.id} className="hover:bg-slate-50">
                      <td className="p-2 text-center font-bold text-slate-500">{index + 1}</td>
                      <td className="p-2">
                        <input className="w-full bg-transparent outline-none font-medium text-slate-800" placeholder="Model name or repair service" value={item.desc} onChange={e => updateItem(item.id, 'desc', e.target.value)} />
                      </td>
                      <td className="p-2 text-center">
                        <select className="bg-transparent border border-slate-200 rounded px-1 py-0.5 text-[11px] outline-none" value={item.category} onChange={e => updateItem(item.id, 'category', e.target.value)}>
                          <option value="Sales Unit">Sales Unit</option>
                          <option value="Service">Service</option>
                          <option value="Accessory">Accessory</option>
                        </select>
                      </td>
                      <td className="p-2 text-center">
                        <input type="number" className="w-full text-center bg-transparent outline-none font-semibold" value={item.qty} onChange={e => updateItem(item.id, 'qty', e.target.value)} />
                      </td>
                      <td className="p-2 text-right">
                        <input type="number" className="w-full text-right bg-transparent outline-none font-semibold" value={item.rate} onChange={e => updateItem(item.id, 'rate', e.target.value)} />
                      </td>
                      <td className="p-2 text-right font-bold text-slate-900">
                        ₹{((Number(item.qty) || 0) * (Number(item.rate) || 0)).toLocaleString('en-IN')}
                      </td>
                      <td className="p-2 text-center no-print">
                        <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <button onClick={addItem} className="no-print bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-3 py-1.5 rounded text-xs transition mb-6">
              + Add Item / Service
            </button>

            {/* Calculations & Warranty Section */}
            <div className="grid grid-cols-2 gap-6 items-start mb-6">
              <div className="bg-sky-50 border-l-4 border-sky-600 p-3.5 rounded-r-md text-xs text-slate-700 space-y-2">
                <h4 className="font-bold text-sky-900 uppercase tracking-wide">🛡️ 30-Day Testing Warranty</h4>
                <p>• 30-day testing warranty covers lamp performance and optical engine clarity.</p>
                <p>• Free diagnostic testing for future maintenance, filters, and bulb servicing.</p>
                <p className="text-slate-500">• Note: Power ballast burn and physical water damage are excluded.</p>
                
                <div className="pt-2 border-t border-sky-200 space-y-2 no-print">
                  <div className="flex items-center justify-between">
                    <label className="font-bold text-slate-700">GST Slab Rate:</label>
                    <select className="bg-white border rounded p-1 text-xs font-bold text-sky-900" value={pricing.gstRate} onChange={e => setPricing({...pricing, gstRate: Number(e.target.value)})}>
                      <option value="18">18% (Standard Projectors)</option>
                      <option value="28">28%</option>
                      <option value="12">12%</option>
                      <option value="5">5%</option>
                      <option value="0">0% (Exempt)</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-0.5">Payment Method:</label>
                    <select className="w-full bg-white border rounded p-1 text-xs font-bold text-sky-900" value={billMeta.paymentMode} onChange={e => setBillMeta({...billMeta, paymentMode: e.target.value})}>
                      <option value="GPay / PhonePe UPI">📱 GPay / PhonePe / UPI</option>
                      <option value="Cash">💵 Cash</option>
                      <option value="Bank Transfer / NEFT">🏦 Bank Transfer / NEFT</option>
                      <option value="Debit / Credit Card">💳 Debit / Credit Card</option>
                    </select>
                  </div>
                </div>
              </div>

              <div className="bg-slate-50 p-3.5 rounded-md border border-slate-200 text-xs space-y-2 font-medium">
                <div className="flex justify-between text-slate-600">
                  <span>Gross Order Value:</span>
                  <span>₹{grossTotal.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-slate-600">Festival Discount (₹):</span>
                  <input type="number" className="w-24 text-right bg-white border rounded px-1.5 py-0.5" value={pricing.discount} onChange={e => setPricing({...pricing, discount: e.target.value})} />
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-slate-600">Old Projector Exchange (₹):</span>
                  <input type="number" className="w-24 text-right bg-white border rounded px-1.5 py-0.5" value={pricing.exchange} onChange={e => setPricing({...pricing, exchange: e.target.value})} />
                </div>
                <div className="flex justify-between text-slate-900 font-bold border-t pt-1.5">
                  <span>Taxable Value:</span>
                  <span>₹{taxableAmount.toLocaleString('en-IN')}</span>
                </div>
                {pricing.gstRate > 0 && (
                  <div className="bg-sky-50/70 p-2 rounded border border-sky-100 space-y-1 text-slate-700">
                    <div className="flex justify-between">
                      <span>CGST ({pricing.gstRate / 2}%):</span>
                      <span>₹{gstBreakdown.cgst.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>SGST ({pricing.gstRate / 2}%):</span>
                      <span>₹{gstBreakdown.sgst.toFixed(2)}</span>
                    </div>
                  </div>
                )}
                <div className="flex justify-between text-slate-900 font-black border-t-2 pt-1 text-base">
                  <span>Net Grand Total:</span>
                  <span>₹{gstBreakdown.netPayable.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center text-sky-700 font-semibold pt-1">
                  <div className="flex items-center gap-1.5">
                    <span>Amount Paid (₹):</span>
                    <button type="button" onClick={handlePayFull} className="no-print text-[10px] bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold px-1.5 py-0.5 rounded border border-sky-300">
                      ⚡ Pay Full
                    </button>
                  </div>
                  <input type="number" className="w-28 text-right bg-white border border-slate-300 rounded px-1.5 py-0.5 text-slate-900 font-bold text-sm" value={pricing.advance} onChange={e => {
                    const val = e.target.value === '' ? '' : Number(e.target.value);
                    setPricing({ ...pricing, advance: val });
                    if (val >= gstBreakdown.netPayable && gstBreakdown.netPayable > 0) setBillMeta(prev => ({ ...prev, paymentStatus: 'Full Paid' }));
                  }} />
                </div>
                <div className={`flex justify-between font-black border-t-2 pt-1.5 text-sm ${pendingDue === 0 ? 'text-emerald-600 border-emerald-500' : 'text-red-600 border-red-600'}`}>
                  <span>{pendingDue === 0 ? 'STATUS: PAID IN FULL' : 'PENDING BALANCE DUE:'}</span>
                  <span>₹{pendingDue.toLocaleString('en-IN')}</span>
                </div>
              </div>
            </div>

            {/* Footer with Stamp & Signature */}
            <div className="flex justify-between items-end border-t border-slate-300 pt-4">
              <div className="text-[11px] text-slate-500">
                <p className="font-semibold text-slate-700">DREAM FOCUS PROJECTORS</p>
                <p>No. 1/A Rengarajan street, Boss veedhi, Sellur, Madurai - 625002</p>
                <p className="mt-1">Payment Method: <strong className="text-slate-900 bg-slate-100 px-2 py-0.5 rounded border border-slate-300">{billMeta.paymentMode}</strong></p>
              </div>

              <div className="flex items-center gap-6">
                <RubberStamp isPaid={pendingDue === 0} />
                <DigitalSignature />
              </div>
            </div>

            {/* Close Modal Button if in Mobile Preview */}
            {deviceMode === 'mobile' && showPreviewModal && (
              <div className="mt-6 text-center no-print">
                <button onClick={() => setShowPreviewModal(false)} className="bg-slate-800 text-white font-bold py-2.5 px-6 rounded-lg text-xs">
                  ✕ Close Preview
                </button>
              </div>
            )}
          </div>

          {/* Desktop Bottom Controls (Shown on Laptop Mode) */}
          {deviceMode === 'laptop' && (
            <div className="mt-5 flex flex-wrap gap-3 no-print">
              <button onClick={sharePDFDirectly} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                📄 Share GST PDF Bill to WhatsApp
              </button>
              <button onClick={() => { saveCurrentOrder(); window.print(); }} className="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-5 rounded-lg shadow transition">
                💾 Save & Print
              </button>
              <button onClick={resetForm} className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-4 rounded-lg transition">
                🔄 New Bill
              </button>
            </div>
          )}
        </div>
      ) : (
        /* ========================================================================= */
        /* 3. SAVED ORDERS & REPORTS VIEW */
        /* ========================================================================= */
        <div className="bg-white rounded-xl shadow-md border border-slate-200 p-4 sm:p-6 space-y-4">
          <div className="flex flex-wrap justify-between items-center gap-3 border-b pb-3">
            <div>
              <h2 className="text-base sm:text-lg font-black text-slate-900">Saved Orders & Audit Reports</h2>
              <p className="text-xs text-slate-500">Auto-saved offline inside your device.</p>
            </div>
            <div className="flex items-center gap-2">
              <select className="bg-slate-50 border rounded p-1 text-xs font-bold" value={analyticsYear} onChange={e => setAnalyticsYear(e.target.value)}>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
              </select>
            </div>
          </div>

          {/* Responsive Cards / Table */}
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs border border-slate-200">
              <thead className="bg-slate-900 text-white uppercase text-[10px] sm:text-[11px]">
                <tr>
                  <th className="p-2">Inv No</th>
                  <th className="p-2">Customer</th>
                  <th className="p-2">Date</th>
                  <th className="p-2 text-right">Total</th>
                  <th className="p-2 text-right">Paid</th>
                  <th className="p-2 text-right">Due</th>
                  <th className="p-2 text-center no-print">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {history.length === 0 ? (
                  <tr><td colSpan="7" className="p-4 text-center text-slate-400">No saved bills yet.</td></tr>
                ) : (
                  history.map(item => (
                    <tr key={item.invNo} className="hover:bg-slate-50">
                      <td className="p-2 font-bold">{item.invNo}</td>
                      <td className="p-2 font-semibold">{item.custName || 'Walk-in'}</td>
                      <td className="p-2 text-slate-500">{item.date}</td>
                      <td className="p-2 text-right font-black">₹{item.netPayable?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-right text-emerald-700 font-semibold">₹{Number(item.paid)?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-right text-red-600 font-black">₹{Number(item.pending)?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-center no-print">
                        <button 
                          onClick={() => {
                            setBillMeta({
                              invNo: item.invNo, date: item.date, custName: item.custName,
                              custPhone: item.custPhone, custAddr: item.custAddr, custGstin: item.custGstin || '',
                              shopGstin: '33AABFD1234F1Z5', paymentStatus: item.paymentStatus, paymentMode: item.paymentMode || 'GPay / PhonePe UPI'
                            });
                            setItems(item.items);
                            setPricing({ discount: item.discount, exchange: item.exchange, gstRate: item.gstRate || 18, advance: item.paid });
                            setTab('create');
                          }}
                          className="text-sky-600 hover:text-sky-800 font-bold mr-2">
                          Load
                        </button>
                        <button onClick={() => setHistory(history.filter(h => h.invNo !== item.invNo))} className="text-red-500 hover:text-red-700 font-bold">
                          ✕
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
