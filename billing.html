<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DREAM FOCUS PROJECTORS - React Order & Billing System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX compilation in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- HTML2PDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      #invoice-root { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen py-6 px-3 sm:px-6">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- Vector Components ---
const ProjectorLogo = () => (
  <svg className="w-12 h-12 flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="20" fill="#0284C7"/>
    <rect x="15" y="38" width="55" height="30" rx="6" fill="#FFFFFF"/>
    <circle cx="35" cy="53" r="9" fill="#0F172A" stroke="#38BDF8" strokeWidth="3"/>
    <circle cx="35" cy="53" r="4" fill="#F59E0B"/>
    <path d="M68 46L90 32V74L68 60V46Z" fill="#F59E0B" opacity="0.9"/>
    <line x1="52" y1="45" x2="52" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <line x1="58" y1="45" x2="58" y2="61" stroke="#0284C7" strokeWidth="2.5" strokeLinecap="round"/>
    <rect x="22" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
    <rect x="54" y="68" width="6" height="4" rx="1" fill="#FFFFFF"/>
  </svg>
);

const RubberStamp = ({ status }) => (
  <div className="w-28 h-28 rounded-full border-4 border-double border-blue-800 text-blue-900 p-2 flex flex-col items-center justify-center -rotate-12 select-none opacity-85 shadow-[0_0_0_1px_#1e40af] bg-blue-50/20">
    <span className="text-[7px] font-black tracking-widest text-center leading-tight uppercase">★ DREAM FOCUS ★<br/>PROJECTORS</span>
    <span className="text-[10px] font-extrabold text-red-700 border-y-2 border-blue-800 my-0.5 px-2 tracking-wider uppercase">
      {status === 'Paid' ? 'PAID FULL' : 'VERIFIED'}
    </span>
    <span className="text-[7px] font-bold tracking-wider">MADURAI - 625002</span>
  </div>
);

const DigitalSignature = () => (
  <div className="text-right flex flex-col items-end">
    <span className="text-[11px] text-slate-500 font-semibold mb-1">Authorized Signatory</span>
    <svg className="w-36 h-10" viewBox="0 0 200 60" fill="none">
      <path d="M15 42 C 25 15, 35 10, 42 35 C 48 50, 52 20, 65 28 C 75 35, 80 22, 92 32 C 100 38, 110 18, 125 35 C 135 45, 140 15, 155 30 C 165 40, 175 25, 185 32" stroke="#0f172a" strokeWidth="2.5" strokeLinecap="round"/>
      <path d="M10 48 Q 90 52 190 44" stroke="#0f172a" strokeWidth="2" strokeLinecap="round"/>
    </svg>
    <div className="text-xs font-bold text-slate-900 border-t border-slate-900 pt-1 w-44 text-center">
      M. KANAGAVEL (Proprietor)
    </div>
  </div>
);

// --- Main Application ---
function App() {
  const [tab, setTab] = useState('create');
  const invoiceRef = useRef(null);

  // Form State
  const [billMeta, setBillMeta] = useState({
    invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
    date: new Date().toISOString().slice(0, 10),
    custName: '',
    custPhone: '',
    custAddr: '',
    paymentStatus: 'Advance',
    paymentMode: 'GPay / PhonePe UPI'
  });

  const [items, setItems] = useState([
    { id: 1, desc: 'Epson EB-X41 Pre-Owned 3LCD Projector (3600 Lumens)', category: 'Sales Unit', qty: 1, rate: 14500 },
    { id: 2, desc: 'Original Remote Control + High Quality HDMI Cable Kit', category: 'Accessory', qty: 1, rate: 0 }
  ]);

  const [pricing, setPricing] = useState({ discount: 500, exchange: 1000, advance: 5000 });
  const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('DFP_REACT_BILLS') || '[]'));
  const [selectedYear, setSelectedYear] = useState('2026');

  // Sync to LocalStorage
  useEffect(() => {
    localStorage.setItem('DFP_REACT_BILLS', JSON.stringify(history));
  }, [history]);

  // Dynamic Calculations
  const grossTotal = useMemo(() => items.reduce((sum, item) => sum + (Number(item.qty) || 0) * (Number(item.rate) || 0), 0), [items]);
  const netPayable = useMemo(() => Math.max(0, grossTotal - (Number(pricing.discount) || 0) - (Number(pricing.exchange) || 0)), [grossTotal, pricing]);
  const pendingDue = useMemo(() => Math.max(0, netPayable - (Number(pricing.advance) || 0)), [netPayable, pricing.advance]);

  // Item List Handlers
  const addItem = () => setItems([...items, { id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
  const removeItem = (id) => setItems(items.filter(i => i.id !== id));
  const updateItem = (id, field, val) => setItems(items.map(i => i.id === id ? { ...i, [field]: val } : i));

  // Save Order Record
  const saveCurrentOrder = () => {
    const record = {
      ...billMeta,
      items,
      grossTotal,
      discount: pricing.discount,
      exchange: pricing.exchange,
      netPayable,
      paid: pricing.advance,
      pending: pendingDue,
      timestamp: Date.now()
    };
    setHistory(prev => {
      const idx = prev.findIndex(p => p.invNo === billMeta.invNo);
      return idx >= 0 ? prev.map((p, i) => i === idx ? record : p) : [record, ...prev];
    });
    return record;
  };

  // PDF Engine & Native WhatsApp Sharing
  const sharePDFDirectly = async () => {
    const record = saveCurrentOrder();
    const opt = {
      margin: 6,
      filename: `${billMeta.invNo.replace(/\//g, '_')}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    try {
      const element = invoiceRef.current;
      const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
      const pdfFile = new File([pdfBlob], `${record.invNo.replace(/\//g, '_')}.pdf`, { type: 'application/pdf' });

      // Direct WhatsApp File Attachment (Web Share API)
      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({
          files: [pdfFile],
          title: `Invoice ${record.invNo}`,
          text: `Order Invoice from DREAM FOCUS PROJECTORS for ${record.custName || 'Customer'}`
        });
      } else {
        // Fallback for Desktop: Auto-download and launch WhatsApp Web
        html2pdf().set(opt).from(element).save();
        if (record.custPhone) {
          const msg = `*DREAM FOCUS PROJECTORS*\nInvoice: ${record.invNo}\nHi ${record.custName}, your order PDF is generated and downloaded.\n*Net Payable:* ₹${record.netPayable}\n*Paid/Advance:* ₹${record.paid}\n*Pending Due:* ₹${record.pending}\nContact: +91 85085 50847`;
          window.open(`https://wa.me/91${record.custPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        } else {
          alert('PDF Downloaded! Enter a customer phone number to launch WhatsApp directly.');
        }
      }
    } catch (err) {
      console.error(err);
      window.print();
    }
  };

  // Export Analytics to CSV
  const exportToCSV = () => {
    let csv = "Invoice No,Date,Customer Name,Phone,Net Total,Paid,Pending Due,Status\n";
    history.forEach(h => {
      csv += `"${h.invNo}","${h.date}","${h.custName}","${h.custPhone}",${h.netPayable},${h.paid},${h.pending},"${h.paymentStatus}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `DFP_Sales_Report_${selectedYear}.csv`;
    a.click();
  };

  return (
    <div className="max-w-4xl mx-auto">
      
      {/* Navigation Header */}
      <div className="flex gap-3 mb-6 no-print">
        <button 
          onClick={() => setTab('create')}
          className={`flex-1 py-3 font-bold rounded-lg text-sm transition shadow-sm ${tab === 'create' ? 'bg-sky-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-50'}`}>
          📝 Generate Order Bill
        </button>
        <button 
          onClick={() => setTab('reports')}
          className={`flex-1 py-3 font-bold rounded-lg text-sm transition shadow-sm ${tab === 'reports' ? 'bg-sky-600 text-white' : 'bg-white text-slate-700 hover:bg-slate-50'}`}>
          📊 Saved Orders & Reports ({history.length})
        </button>
      </div>

      {tab === 'create' ? (
        <div>
          {/* Printable Invoice Container */}
          <div ref={invoiceRef} id="invoice-root" className="bg-white rounded-xl shadow-md border border-slate-200 p-6 sm:p-8">
            
            {/* Header with Projector Branding */}
            <div className="bg-gradient-to-r from-slate-900 to-sky-700 text-white p-5 rounded-lg flex justify-between items-center mb-6">
              <div className="flex items-center gap-4">
                <ProjectorLogo />
                <div>
                  <h1 className="text-xl sm:text-2xl font-black tracking-tight leading-none">DREAM FOCUS PROJECTORS</h1>
                  <p className="text-sky-300 text-xs font-semibold tracking-wider uppercase mt-1">Pre-Owned Sales • Chip-Level Repair • Projector Accessories</p>
                  <p className="text-slate-300 text-[11px] mt-0.5">Madurai Branch • Phone / WhatsApp: +91 85085 50847</p>
                </div>
              </div>
              <div className="text-right">
                <span className="text-amber-400 font-black text-xl tracking-wider block">ORDER INVOICE</span>
                <span className="bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide inline-block mt-1">
                  {billMeta.paymentStatus} CONFIRMED
                </span>
              </div>
            </div>

            {/* Customer & Invoice Meta Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6">
              <div>
                <h3 className="text-xs font-bold text-sky-700 uppercase tracking-wider border-b border-slate-200 pb-1 mb-2">Billed To (Customer Details)</h3>
                <div className="space-y-1.5 text-xs">
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Name:</span>
                    <input className="font-bold flex-1 bg-transparent border-b border-slate-200 focus:border-sky-500 outline-none" placeholder="Enter Customer Name" value={billMeta.custName} onChange={e => setBillMeta({...billMeta, custName: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">WhatsApp:</span>
                    <input className="flex-1 bg-transparent border-b border-slate-200 focus:border-sky-500 outline-none" placeholder="10-Digit Mobile Number" value={billMeta.custPhone} onChange={e => setBillMeta({...billMeta, custPhone: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Address:</span>
                    <input className="flex-1 bg-transparent border-b border-slate-200 focus:border-sky-500 outline-none" placeholder="Madurai Area / City" value={billMeta.custAddr} onChange={e => setBillMeta({...billMeta, custAddr: e.target.value})} />
                  </div>
                </div>
              </div>

              <div>
                <h3 className="text-xs font-bold text-sky-700 uppercase tracking-wider border-b border-slate-200 pb-1 mb-2">Invoice Meta</h3>
                <div className="space-y-1.5 text-xs">
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Invoice No:</span>
                    <input className="font-bold flex-1 bg-transparent border-b border-slate-200 outline-none" value={billMeta.invNo} onChange={e => setBillMeta({...billMeta, invNo: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Date:</span>
                    <input type="date" className="flex-1 bg-transparent border-b border-slate-200 outline-none" value={billMeta.date} onChange={e => setBillMeta({...billMeta, date: e.target.value})} />
                  </div>
                  <div className="flex items-center"><span className="w-24 text-slate-500 font-semibold">Proprietor:</span>
                    <span className="font-semibold text-slate-800">M. KANAGAVEL</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Order Items Table */}
            <div className="overflow-x-auto mb-4">
              <table className="w-full text-left border border-slate-200 text-xs">
                <thead>
                  <tr className="bg-slate-900 text-white uppercase text-[11px]">
                    <th className="p-2.5 text-center w-10">#</th>
                    <th className="p-2.5">Item / Service Description</th>
                    <th className="p-2.5 w-28 text-center">Category</th>
                    <th className="p-2.5 text-center w-16">Qty</th>
                    <th className="p-2.5 text-right w-24">Rate (₹)</th>
                    <th className="p-2.5 text-right w-24">Total (₹)</th>
                    <th className="p-2.5 text-center w-10 no-print"></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {items.map((item, index) => (
                    <tr key={item.id} className="hover:bg-slate-50">
                      <td className="p-2 text-center font-bold text-slate-500">{index + 1}</td>
                      <td className="p-2">
                        <input className="w-full bg-transparent outline-none font-medium text-slate-800" placeholder="Model name or repair service" value={item.desc} onChange={e => updateItem(item.id, 'desc', e.target.value)} />
                      </td>
                      <td className="p-2 text-center">
                        <select className="bg-transparent border border-slate-200 rounded px-1 py-0.5 text-[11px] outline-none" value={item.category} onChange={e => updateItem(item.id, 'category', e.target.value)}>
                          <option value="Sales Unit">Sales Unit</option>
                          <option value="Service">Service</option>
                          <option value="Accessory">Accessory</option>
                        </select>
                      </td>
                      <td className="p-2 text-center">
                        <input type="number" className="w-full text-center bg-transparent outline-none font-semibold" value={item.qty} onChange={e => updateItem(item.id, 'qty', e.target.value)} />
                      </td>
                      <td className="p-2 text-right">
                        <input type="number" className="w-full text-right bg-transparent outline-none font-semibold" value={item.rate} onChange={e => updateItem(item.id, 'rate', e.target.value)} />
                      </td>
                      <td className="p-2 text-right font-bold text-slate-900">
                        ₹{((Number(item.qty) || 0) * (Number(item.rate) || 0)).toLocaleString('en-IN')}
                      </td>
                      <td className="p-2 text-center no-print">
                        <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <button onClick={addItem} className="no-print bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-3 py-1.5 rounded text-xs transition mb-6">
              + Add Item / Service
            </button>

            {/* Financial Summary & Warranty Terms */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 items-start mb-6">
              <div className="bg-sky-50 border-l-4 border-sky-600 p-3.5 rounded-r-md text-xs text-slate-700 space-y-1.5">
                <h4 className="font-bold text-sky-900 uppercase tracking-wide">🛡️ 30-Day Testing Warranty</h4>
                <p>• 30-day testing warranty covers lamp performance and optical engine clarity.</p>
                <p>• Free diagnostic testing for future maintenance, filters, and bulb servicing.</p>
                <p className="text-slate-500">• Note: Power ballast burn and physical water damage are excluded.</p>
                
                <div className="pt-2 no-print">
                  <label className="block font-bold text-slate-600 mb-1">Status:</label>
                  <select className="w-full bg-white border border-slate-300 rounded p-1 text-xs" value={billMeta.paymentStatus} onChange={e => setBillMeta({...billMeta, paymentStatus: e.target.value})}>
                    <option value="Paid">Full Paid</option>
                    <option value="Advance">Advance Paid</option>
                    <option value="Pending">Pending Due</option>
                    <option value="Exchange">Exchange Unit</option>
                  </select>
                </div>
              </div>

              <div className="bg-slate-50 p-3.5 rounded-md border border-slate-200 text-xs space-y-2 font-medium">
                <div className="flex justify-between text-slate-600">
                  <span>Gross Order Total:</span>
                  <span>₹{grossTotal.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-slate-600">Festival Discount (₹):</span>
                  <input type="number" className="w-24 text-right bg-white border border-slate-300 rounded px-1.5 py-0.5" value={pricing.discount} onChange={e => setPricing({...pricing, discount: e.target.value})} />
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-slate-600">Old Projector Exchange (₹):</span>
                  <input type="number" className="w-24 text-right bg-white border border-slate-300 rounded px-1.5 py-0.5" value={pricing.exchange} onChange={e => setPricing({...pricing, exchange: e.target.value})} />
                </div>
                <div className="flex justify-between text-slate-900 font-bold border-t border-slate-300 pt-1.5 text-sm">
                  <span>Net Payable:</span>
                  <span>₹{netPayable.toLocaleString('en-IN')}</span>
                </div>
                <div className="flex justify-between items-center text-sky-700 font-semibold">
                  <span>Advance Received (₹):</span>
                  <input type="number" className="w-24 text-right bg-white border border-slate-300 rounded px-1.5 py-0.5 text-slate-900 font-bold" value={pricing.advance} onChange={e => setPricing({...pricing, advance: e.target.value})} />
                </div>
                <div className="flex justify-between text-red-600 font-black border-t-2 border-red-600 pt-1.5 text-sm">
                  <span>PENDING BALANCE DUE:</span>
                  <span>₹{pendingDue.toLocaleString('en-IN')}</span>
                </div>
              </div>
            </div>

            {/* Footer Section: Stamp & Signature */}
            <div className="flex justify-between items-end border-t border-slate-300 pt-4">
              <div className="text-[11px] text-slate-500">
                <p className="font-semibold text-slate-700">DREAM FOCUS PROJECTORS</p>
                <p>No. 1/A Rengarajan street, Boss veedhi, Sellur, Madurai - 625002</p>
                <p className="mt-1">Mode: <strong className="text-slate-700">{billMeta.paymentMode}</strong></p>
              </div>

              <div className="flex items-center gap-6">
                <RubberStamp status={billMeta.paymentStatus} />
                <DigitalSignature />
              </div>
            </div>

          </div>

          {/* Action Trigger Bar */}
          <div className="mt-5 flex flex-wrap gap-3 no-print">
            <button 
              onClick={sharePDFDirectly} 
              className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
              📄 Share PDF File to WhatsApp
            </button>
            <button 
              onClick={() => { saveCurrentOrder(); window.print(); }} 
              className="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-5 rounded-lg shadow transition">
              💾 Save & Print
            </button>
            <button 
              onClick={() => {
                setBillMeta({
                  invNo: `DFP/2026/${Math.floor(1000 + Math.random() * 9000)}`,
                  date: new Date().toISOString().slice(0, 10),
                  custName: '', custPhone: '', custAddr: '',
                  paymentStatus: 'Advance', paymentMode: 'GPay / PhonePe UPI'
                });
                setItems([{ id: Date.now(), desc: '', category: 'Sales Unit', qty: 1, rate: 0 }]);
                setPricing({ discount: 0, exchange: 0, advance: 0 });
              }} 
              className="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-4 rounded-lg transition">
              🔄 Reset Form
            </button>
          </div>
        </div>
      ) : (
        /* Saved Analytics Dashboard */
        <div className="bg-white rounded-xl shadow-md border border-slate-200 p-6">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-lg font-bold text-slate-900">Saved Order Transactions & Analytics</h2>
            <button onClick={exportToCSV} className="bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-3 py-2 rounded transition">
              📥 Export to Excel (CSV)
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div className="bg-slate-50 border-l-4 border-sky-600 p-3 rounded">
              <span className="text-[11px] font-bold text-slate-500 uppercase">Total Sales</span>
              <div className="text-lg font-black text-slate-900">
                ₹{history.reduce((s, h) => s + (h.netPayable || 0), 0).toLocaleString('en-IN')}
              </div>
            </div>
            <div className="bg-slate-50 border-l-4 border-emerald-600 p-3 rounded">
              <span className="text-[11px] font-bold text-slate-500 uppercase">Cash/UPI Collected</span>
              <div className="text-lg font-black text-emerald-700">
                ₹{history.reduce((s, h) => s + (Number(h.paid) || 0), 0).toLocaleString('en-IN')}
              </div>
            </div>
            <div className="bg-slate-50 border-l-4 border-red-600 p-3 rounded">
              <span className="text-[11px] font-bold text-slate-500 uppercase">Pending Dues</span>
              <div className="text-lg font-black text-red-600">
                ₹{history.reduce((s, h) => s + (Number(h.pending) || 0), 0).toLocaleString('en-IN')}
              </div>
            </div>
            <div className="bg-slate-50 border-l-4 border-purple-600 p-3 rounded">
              <span className="text-[11px] font-bold text-slate-500 uppercase">Trade-In Value</span>
              <div className="text-lg font-black text-purple-700">
                ₹{history.reduce((s, h) => s + (Number(h.exchange) || 0), 0).toLocaleString('en-IN')}
              </div>
            </div>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs border border-slate-200">
              <thead className="bg-slate-900 text-white uppercase text-[11px]">
                <tr>
                  <th className="p-2">Invoice No</th>
                  <th className="p-2">Date</th>
                  <th className="p-2">Customer</th>
                  <th className="p-2">Status</th>
                  <th className="p-2 text-right">Net</th>
                  <th className="p-2 text-right">Paid</th>
                  <th className="p-2 text-right">Due</th>
                  <th className="p-2 text-center">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {history.length === 0 ? (
                  <tr><td colSpan="8" className="p-4 text-center text-slate-400">No saved orders yet.</td></tr>
                ) : (
                  history.map(item => (
                    <tr key={item.invNo} className="hover:bg-slate-50">
                      <td className="p-2 font-bold">{item.invNo}</td>
                      <td className="p-2 text-slate-500">{item.date}</td>
                      <td className="p-2 font-medium">{item.custName || 'Walk-in'}</td>
                      <td className="p-2">
                        <span className="bg-sky-100 text-sky-800 font-bold px-2 py-0.5 rounded text-[10px]">
                          {item.paymentStatus}
                        </span>
                      </td>
                      <td className="p-2 text-right font-semibold">₹{item.netPayable?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-right text-emerald-700 font-semibold">₹{Number(item.paid)?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-right text-red-600 font-black">₹{Number(item.pending)?.toLocaleString('en-IN')}</td>
                      <td className="p-2 text-center">
                        <button 
                          onClick={() => {
                            setBillMeta({
                              invNo: item.invNo, date: item.date, custName: item.custName,
                              custPhone: item.custPhone, custAddr: item.custAddr,
                              paymentStatus: item.paymentStatus, paymentMode: item.paymentMode
                            });
                            setItems(item.items);
                            setPricing({ discount: item.discount, exchange: item.exchange, advance: item.paid });
                            setTab('create');
                          }}
                          className="text-sky-600 hover:text-sky-800 font-bold mr-2">
                          Load
                        </button>
                        <button 
                          onClick={() => setHistory(history.filter(h => h.invNo !== item.invNo))}
                          className="text-red-500 hover:text-red-700 font-bold">
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
